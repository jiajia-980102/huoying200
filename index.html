function render(){
 const q=$('search').value.trim().toLowerCase(),only=$('only').checked;
 $('counter').textContent=`已选 ${selected.length} / 100 期`;
 $('bar').style.width=selected.length+'%';
 $('create').disabled=!selected.length;
 $('create').textContent=selected.length?`一键创作（已选${selected.length}期）`:'一键创作（先写第一期）';
 for(const n of nodes){const id=Number(n.dataset.id),checked=selected.includes(id);n.querySelector('input').checked=checked;n.classList.toggle('checked',checked);n.hidden=(only&&!checked)||!(`${n.dataset.title} ${id} ${n.dataset.group}`.toLowerCase().includes(q));}
 for(const sec of document.querySelectorAll('.group')){const items=Array.from(sec.querySelectorAll('.item'));sec.hidden=!items.some(n=>!n.hidden);sec.querySelector('.groupcount').textContent=items.filter(n=>selected.includes(Number(n.dataset.id))).length+'/10';}
}
for(const n of nodes)n.querySelector('input').addEventListener('change',e=>{const id=Number(n.dataset.id);selected=e.target.checked?[...selected.filter(x=>x!==id),id]:selected.filter(x=>x!==id);save();render();});
$('all').onclick=()=>{selected=nodes.map(n=>Number(n.dataset.id));save();render();};
$('clear').onclick=()=>{selected=[];save();render();};
$('only').onchange=render;$('search').oninput=render;
function prompt(){const [duration,count]=$('duration').value.split('|');const chosen=selected.map(id=>nodes.find(n=>Number(n.dataset.id)===id)).filter(Boolean);return `请按照以下勾选顺序创作《火影忍者》人物招式能力深度解析系列，本次只写第一期，其余后续继续：${chosen.map(n=>`第${n.dataset.id}期《${n.dataset.title}》`).join('；')}。要求：${duration}，${count}字符（包含标点，实际核对），全文不换行，开头3秒直入招式细节，原作战斗与设定准确，重点拆解发动条件、规则、限制、破解方法，少复述剧情，不做战力数值计算，不写AI模板词，不重复解释。结尾自然衔接下一条已选题材，附20字以内抖音标题。`;}
async function copy(t){try{await navigator.clipboard.writeText(t);alert('已复制');}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove();alert('已尝试复制，请检查剪贴板');}}
$('copy').onclick=()=>selected.length?copy(prompt()):alert('请先勾选题材');
$('copyall').onclick=()=>copy(nodes.map(n=>`第${n.dataset.id}期｜${n.dataset.title}`).join('\n'));
$('create').onclick=()=>{if(!selected.length)return;copy(prompt()).then(()=>window.open('https://chatgpt.com/','_blank','noopener'));};
render();
})();
</script></body></html>
