<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火影忍者101—200期交互选题器</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#202735;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif}.wrap{max-width:920px;margin:auto;padding:24px 16px 70px}h1{font-size:27px;margin:0 0 8px}.muted{color:#667085;font-size:14px}.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 3px 20px #17223812;margin:18px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #d6dce5;background:white;padding:10px 14px;border-radius:10px;font-size:14px;cursor:pointer}.primary{background:#263b77;color:white;border-color:#263b77}.btn:disabled{opacity:.45;cursor:not-allowed}select,input[type=search]{padding:10px;border:1px solid #d6dce5;border-radius:10px;font-size:14px;max-width:100%}.progress{height:8px;background:#e9edf5;border-radius:10px;margin:13px 0;overflow:hidden}.bar{height:100%;background:#3558bd;width:0;transition:width .15s}.group{margin-top:22px}.group h2{font-size:17px;border-bottom:1px solid #edf0f5;padding-bottom:10px}.item{display:flex;align-items:flex-start;gap:12px;border-radius:10px;padding:11px 9px;cursor:pointer;line-height:1.5}.item:hover{background:#f3f6fc}.item.checked{background:#eef3ff}.item input{accent-color:#3558bd;width:19px;height:19px;flex-shrink:0;margin-top:2px}.footer{position:sticky;bottom:0;background:#fff;border-top:1px solid #e4e8f0;padding:12px 16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;box-shadow:0 -3px 15px #0000000b}.note{font-size:13px;color:#667085;line-height:1.8}#notice{font-size:13px;color:#2852a4}@media(max-width:500px){h1{font-size:22px}.panel{padding:15px}.btn{padding:9px 11px}}</style></head><body><main class="wrap"><h1>火影忍者 · 第二批100期选题器</h1><p class="muted">第101—200期｜勾选后按勾选顺序生成创作提示词</p><section class="panel"><b id="counter">已选 0 / 100 期</b><div class="progress"><div class="bar" id="bar"></div></div><div class="toolbar"><button class="btn" id="all">全选</button><button class="btn" id="clear">取消全选</button><label><input type="checkbox" id="only"> 只看已勾选</label><input type="search" id="search" placeholder="搜索招式、人物或关键词"></div><div class="toolbar" style="margin-top:14px"><span>文案时长：</span><select id="duration"><option value="2分40秒|1013">2分40秒 · 1013字符</option><option value="5分钟|1900">5分钟 · 1900字符</option><option value="1分40秒|633">1分40秒 · 633字符</option><option value="4分钟|1520">4分钟 · 1520字符</option></select></div><p class="note">可多选、取消勾选；选择状态自动保存在当前浏览器。生成提示词时仅创作第一期，其余题材排队。</p></section><section class="panel" id="list"></section></main><div class="footer"><button class="btn primary" id="create" disabled>一键创作（先写第一期）</button><button class="btn" id="copy">复制创作提示词</button><button class="btn" id="copyall">复制100期题材</button></div><script>const groups=[{"name": "封印术与特殊禁术", "items": ["尸鬼封尽为什么连施术者的灵魂也要付出代价？", "四象封印为什么能让九尾查克拉逐渐泄露？", "八卦封印为什么没有彻底隔绝九尾的力量？", "五行封印为什么能干扰鸣人体内的查克拉？", "五行解印为什么能解除大蛇丸留下的封印？", "金刚封锁为什么能压制尾兽的行动？", "里四象封印为什么必须在施术者死亡时发动？", "舌祸根绝之印为什么能让根组织成员无法泄密？", "封火法印为什么能够封住天照的黑炎？", "幻龙九封尽为什么需要多名成员长时间配合？"]}, {"name": "幻术与感知干扰", "items": ["魔幻·树缚杀为什么必须让敌人陷入幻觉？", "黑暗行之术为什么能剥夺敌人的视觉？", "蛤蟆临唱为什么连佩恩也难以摆脱？", "魔幻·奈落见之术为什么能让敌人看见内心恐惧？", "魔笛·梦幻音锁为什么能通过声音困住敌人？", "魔镜天地转为什么能够反弹对方的幻术？", "幻术·霞从者之术为什么能不断制造虚假的敌人？", "涅槃精舍之术为什么能够让大范围目标陷入沉睡？", "幻术泡沫为什么能通过短暂接触干扰对手？", "写轮眼幻术为什么能操控尾兽的行动？"]}, {"name": "木叶秘传与特殊忍术", "items": ["影子模仿术为什么必须依靠影子连接目标？", "影首缚颈术为什么能让影子直接攻击敌人？", "影缝术为什么能把影子变成攻击武器？", "心转身之术为什么会让施术者本体失去行动能力？", "心乱身之术为什么能干扰敌人的身体行动？", "倍化术为什么会大幅增加身体的负担？", "超倍化术为什么能让丁次变成巨人？", "蝶弹爆击为什么需要消耗大量身体能量？", "寄坏虫之术为什么能悄悄吞噬敌人的查克拉？", "牙通牙为什么必须依靠人与忍犬的配合？"]}, {"name": "砂隐与傀儡机关", "items": ["砂缚柩为什么能在敌人察觉之前完成束缚？", "砂瀑送葬为什么必须先用沙子困住目标？", "砂之盾为什么能在我爱罗没有反应时自动保护他？", "砂之铠为什么会持续消耗我爱罗的查克拉？", "第三只眼为什么能让我爱罗远距离观察战场？", "砂分身为什么能在遭到攻击后继续牵制敌人？", "砂铁时雨为什么能让傀儡师难以闪避？", "砂铁界法为什么能封锁大范围的移动空间？", "傀儡术为什么需要查克拉线才能操控傀儡？", "赤秘技·百机操演为什么能同时操纵大量傀儡？"]}, {"name": "水遁、雾隐与特殊血继", "items": ["水牢之术为什么需要施术者持续维持？", "水镜之术为什么能制造出对手的复制体？", "水化之术为什么能躲过普通的物理攻击？", "水铁炮之术为什么能从手指发出高速攻击？", "蒸危暴威为什么能不断制造爆炸？", "无声杀人术为什么能在浓雾中锁定目标？", "魔镜冰晶为什么能让白在镜子之间高速移动？", "冰遁为什么能同时具备水与风的性质？", "沸遁·巧雾之术为什么连须佐能乎也能腐蚀？", "溶遁·溶怪之术为什么能限制敌人的活动范围？"]}, {"name": "雷遁与云隐秘术", "items": ["雷遁查克拉模式为什么能同时提升速度与防御？", "地狱突刺为什么手指越少攻击越集中？", "黑雷为什么能形成普通雷遁难以模仿的攻击？", "雷遁·雷幻雷光柱为什么能配合幻术干扰敌人？", "雷遁·感激波为什么能借助水扩大攻击范围？", "雷犂热刀为什么需要高速冲撞才能发挥威力？", "双重雷犂热刀为什么必须两个人同时配合？", "雷遁影分身为什么能在消失时麻痹敌人？", "雷遁·四柱束缚之术为什么能限制目标行动？", "雷遁·伪暗为什么能从面具中释放强力雷击？"]}, {"name": "土遁、岩隐与爆遁", "items": ["土遁·轻重岩之术为什么能改变物体的重量？", "土遁·超加重岩之术为什么能强化攻击的压制力？", "土遁·土流壁为什么能快速形成防御屏障？", "土遁·土中潜航为什么能让忍者在地下移动？", "土遁·黄泉沼为什么能困住体型巨大的敌人？", "土遁·土矛为什么能让角都的身体变得坚硬？", "爆遁·地雷拳为什么能让近身攻击产生爆炸？", "起爆黏土C1为什么能把小型黏土变成武器？", "起爆黏土C2为什么需要飞龙配合布置地雷？", "起爆黏土C3为什么能威胁整座忍村？"]}, {"name": "通灵兽与特殊召唤", "items": ["通灵术为什么必须签订契约才能召唤忍兽？", "逆通灵之术为什么能把忍者传送到通灵兽身边？", "蛤蟆口束缚术为什么能把敌人困进巨大空间？", "蛤蟆油炎弹为什么需要蛤蟆与忍者共同配合？", "蛤蟆铁炮为什么能利用水流攻击远处目标？", "罗生门为什么能在短时间内挡住强力攻击？", "三重罗生门为什么仍然无法完全挡住尾兽攻击？", "秽土转生通灵契约为什么能限制被召唤者的行动？", "万蛇为什么会向大蛇丸索要活人祭品？", "猿魔为什么能变成坚硬的金刚如意棒？"]}, {"name": "特殊忍具与战斗技巧", "items": ["飞燕为什么能让阿斯玛的查克拉刀刃延伸？", "查克拉手术刀为什么能切断肌肉却不留下普通刀伤？", "掌仙术为什么能加速伤口恢复却无法治疗所有伤势？", "创造再生为什么需要消耗大量查克拉？", "百豪之术为什么能够让纲手持续恢复伤势？", "雾隐七忍刀的鲛肌为什么能吞噬敌人的查克拉？", "斩首大刀为什么能利用血液中的铁修复刀身？", "雷刀·牙为什么能引导雷电攻击敌人？", "爆刀·飞沫为什么能让刀身不断产生爆炸？", "长刀·缝针为什么能把敌人串联束缚？"]}, {"name": "六道能力与忍界终局", "items": ["求道玉为什么能让普通忍术失去作用？", "六道仙术为什么能让鸣人触碰求道玉？", "阴阳遁为什么能让某些忍术效果失效？", "轮回眼的通灵之术为什么能召唤外道魔像？", "外道魔像为什么需要吸收尾兽才能恢复力量？", "神树界降诞为什么能从地下伸出大量树根？", "天之御中为什么能瞬间改变战斗空间？", "黄泉比良坂为什么能打开不同空间之间的通道？", "共杀灰骨为什么能让被击中的身体逐渐崩解？", "膨胀求道玉为什么能威胁辉夜所在的整个空间？"]}];const all=groups.flatMap((g,i)=>g.items.map((title,j)=>({id:101+i*10+j,title,group:g.name})));let selected=[];try{selected=JSON.parse(localStorage.getItem('naruto_topics_101_200')||'[]').filter(x=>all.some(a=>a.id===x))}catch(e){}const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem('naruto_topics_101_200',JSON.stringify(selected))}catch(e){}};function render(){const only=$('only').checked,q=$('search').value.trim().toLowerCase();$('counter').textContent=`已选 ${selected.length} / 100 期`;$('bar').style.width=selected.length+'%';$('create').disabled=!selected.length;$('create').textContent=`一键创作（已选${selected.length}期）`;const list=$('list');list.replaceChildren();for(const g of groups){const items=all.filter(x=>x.group===g.name&&(!only||selected.includes(x.id))&&(!q||(x.title+' '+x.id+' '+x.group).toLowerCase().includes(q)));if(!items.length)continue;const sec=document.createElement('section');sec.className='group';const h=document.createElement('h2');h.textContent=g.name+' · '+g.items.filter((_,j)=>selected.includes(all.find(x=>x.group===g.name&&x.title===g.items[j]).id)).length+'/10';sec.append(h);for(const x of items){const label=document.createElement('label');label.className='item'+(selected.includes(x.id)?' checked':'');const input=document.createElement('input');input.type='checkbox';input.checked=selected.includes(x.id);input.addEventListener('change',()=>{if(input.checked){if(!selected.includes(x.id))selected.push(x.id)}else selected=selected.filter(id=>id!==x.id);save();render()});const span=document.createElement('span');span.textContent=`第${x.id}期｜${x.title}`;label.append(input,span);sec.append(label)}list.append(sec)}if(!list.childElementCount)list.textContent='没有符合条件的题材'}function prompt(){const [duration,count]=$('duration').value.split('|');const chosen=selected.map(id=>all.find(x=>x.id===id)).filter(Boolean);return `请按照以下勾选顺序创作《火影忍者》人物招式能力深度解析系列，本次只写第一期，其余后续继续：${chosen.map(x=>`第${x.id}期《${x.title}》`).join('；')}。要求：${duration}，${count}字符（包含标点，实际核对），全文不换行，开头3秒直入招式细节或用“为什么”制造悬念，原作战斗与设定准确，重点拆解发动条件、规则、限制、破解方法，少复述剧情，不做战力数值计算，不写AI模板词，不重复解释。结尾自然衔接下一条已选题材，附20字以内抖音标题。`}async function copy(t){try{await navigator.clipboard.writeText(t);alert('已复制到剪贴板')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove();alert('已尝试复制，请检查剪贴板')}}$('all').onclick=()=>{selected=all.map(x=>x.id);save();render()};$('clear').onclick=()=>{selected=[];save();render()};$('only').onchange=render;$('search').oninput=render;$('copy').onclick=()=>selected.length?copy(prompt()):alert('请先勾选题材');$('copyall').onclick=()=>copy(all.map(x=>`第${x.id}期｜${x.title}`).join('
'));$('create').onclick=()=>{if(!selected.length)return;const p=prompt();copy(p).then(()=>{window.open('https://chatgpt.com/','_blank','noopener')})};render();</script></body></html>
